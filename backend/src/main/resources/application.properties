# Server Configuration
server.port=8080

# Database Configuration (H2 for Dev, MySQL commented)
spring.datasource.url=jdbc:h2:mem:ocrdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# spring.datasource.url=jdbc:mysql://localhost:3306/ocr_tool?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File Storage Configuration
file.upload-dir=uploads

# Custom Properties
file.processed-dir=processed

# Tesseract OCR Configuration
tesseract.data-path=C:/Program Files/Tesseract-OCR/tessdata
